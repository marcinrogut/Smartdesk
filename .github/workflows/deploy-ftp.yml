name: Build and deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, json, libxml, zip, curl, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Lint PHP sources
        run: composer lint

      - name: Run tests
        run: composer test
        env:
          API_SECRET: test-secret-0123456789

  deploy:
    name: Deploy to FTP
    needs: test
    # Wymaga repo variables (Settings -> Secrets and variables -> Actions -> Variables):
    # FTP_PROJECT_ROOT, FTP_DEPLOY_PATH. Dopóki ich nie ma, deploy jest pomijany.
    if: vars.FTP_PROJECT_ROOT != '' && vars.FTP_DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, json, libxml, zip, curl, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

      # Zawartość public/ (API + zbudowany Angular) trafia do webroota.
      - name: Stage Angular build into webroot
        run: |
          cp -R frontend/dist/angular/. public/
          echo "📦 Pliki Angulara zastage'owane w public/ (webroot):"
          ls -1 public

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy public/ to webroot
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DEPLOY_PATH: ${{ vars.FTP_DEPLOY_PATH }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            mkdir -p $FTP_DEPLOY_PATH;
            lcd public;
            cd $FTP_DEPLOY_PATH;
            mirror -R --delete --verbose --no-empty-dirs . .;
            bye
          "

      # Kod aplikacji (poza public/) -> katalog projektu, poza public_html.
      - name: Deploy backend dirs to project root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROJECT_ROOT: ${{ vars.FTP_PROJECT_ROOT }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            mkdir -p $FTP_PROJECT_ROOT;
            cd $FTP_PROJECT_ROOT;
            mirror -R --verbose --no-empty-dirs src src;
            mirror -R --verbose --no-empty-dirs config config;
            mirror -R --verbose --no-empty-dirs database database;
            mirror -R --verbose --no-empty-dirs storage storage;
            mirror -R --verbose --no-empty-dirs vendor vendor;
            put composer.json;
            put composer.lock;
            bye
          "

      - name: Ensure API_SECRET in production .env
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROJECT_ROOT: ${{ vars.FTP_PROJECT_ROOT }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          if [ -z "$API_SECRET" ]; then
            echo "::error::GitHub secret API_SECRET is not set"
            exit 1
          fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            cd $FTP_PROJECT_ROOT;
            get .env -o .env.remote;
            bye
          "
          if [ ! -f .env.remote ]; then
            echo "::error::Remote .env not found at $FTP_PROJECT_ROOT — utwórz go ręcznie na serwerze"
            exit 1
          fi
          if grep -q '^API_SECRET=' .env.remote; then
            echo "✅ API_SECRET już jest w zdalnym .env — nic nie zmieniam"
          else
            printf '\nAPI_SECRET=%s\n' "$API_SECRET" >> .env.remote
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode yes;
              cd $FTP_PROJECT_ROOT;
              put .env.remote -o .env;
              bye
            "
            echo "✅ API_SECRET dopisany do zdalnego .env"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Author: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Webroot: \`${{ vars.FTP_DEPLOY_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Website: https://smartdesk.rogut.net/" >> $GITHUB_STEP_SUMMARY
