name: Build and deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, json, libxml, sqlite3, pdo_sqlite, zip, curl
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to FTP
    needs: test
    # Wymaga repo variables (Settings -> Secrets and variables -> Actions -> Variables):
    # FTP_PROJECT_ROOT, FTP_DEPLOY_PATH. Dopóki ich nie ma, deploy jest pomijany.
    if: vars.FTP_PROJECT_ROOT != '' && vars.FTP_DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-web/package-lock.json

      - name: Build Angular app
        working-directory: angular-web
        run: |
          npm ci
          npm run build -- --base-href=/app/

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, json, libxml, sqlite3, pdo_sqlite, zip, curl
          tools: composer
          coverage: none

      - name: Install production PHP dependencies
        working-directory: laravel-api
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Zawartość laravel-api/public -> docroot subdomeny (public_html).
      # MUSI być przed deployem Angulara: --delete czyści webroot (usuwając stary /app),
      # a kolejny krok odtworzy podkatalog /app.
      # Uwaga: --delete usuwa wszystko w public_html, czego nie ma w laravel-api/public.
      - name: Deploy Laravel public to webroot
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DEPLOY_PATH: ${{ vars.FTP_DEPLOY_PATH }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            set net:socket-bind-ipv4 true;
            set ftp:use-ipv6 false;
            mkdir -p $FTP_DEPLOY_PATH;
            lcd laravel-api/public;
            cd $FTP_DEPLOY_PATH;
            mirror -R --delete --verbose . .;
            bye
          "

      # Zbudowany Angular (SPA) -> podkatalog /app w webroocie (base-href=/app/).
      # Zakres ograniczony do public_html/app, więc --delete nie rusza plików Laravela w webroocie.
      - name: Deploy Angular SPA to /app
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DEPLOY_PATH: ${{ vars.FTP_DEPLOY_PATH }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            set net:socket-bind-ipv4 true;
            set ftp:use-ipv6 false;
            mkdir -p $FTP_DEPLOY_PATH/app;
            lcd angular-web/dist/angular-web/browser;
            cd $FTP_DEPLOY_PATH/app;
            mirror -R --delete --verbose . .;
            bye
          "

      # Backend Laravela -> katalog projektu (rodzeństwo webroota, poza public_html).
      # public/ nie jest tu wysyłane: jego zawartość trafia do FTP_DEPLOY_PATH.
      - name: Deploy Laravel backend to project root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROJECT_ROOT: ${{ vars.FTP_PROJECT_ROOT }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            set net:socket-bind-ipv4 true;
            set ftp:use-ipv6 false;
            mkdir -p $FTP_PROJECT_ROOT;
            cd $FTP_PROJECT_ROOT;
            mirror -R --delete --verbose --no-empty-dirs app app;
            mirror -R --delete --verbose --no-empty-dirs bootstrap bootstrap;
            mirror -R --delete --verbose --no-empty-dirs config config;
            mirror -R --delete --verbose --no-empty-dirs database database;
            mirror -R --delete --verbose --no-empty-dirs resources resources;
            mirror -R --delete --verbose --no-empty-dirs routes routes;
            mirror -R --delete --verbose --no-empty-dirs storage storage;
            mirror -R --delete --verbose --no-empty-dirs vendor vendor;
            put composer.json;
            put composer.lock;
            put artisan;
            bye
          "

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Author: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
